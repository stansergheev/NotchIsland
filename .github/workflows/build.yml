name: Build

# Every push to main is compiled on a Mac to catch errors.
# When the version in Info.plist (CFBundleShortVersionString) is new,
# NotchIsland.dmg is published as a GitHub Release named after it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and disk image
        run: ./build.sh --dmg

      - name: Keep the disk image for this run
        uses: actions/upload-artifact@v4
        with:
          name: NotchIsland-dmg
          path: build/NotchIsland.dmg

      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NotchIsland ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: build/NotchIsland.dmg
          body: |
            **Install:** open NotchIsland.dmg and drag NotchIsland into Applications.

            **First launch:** macOS will say it can't verify the app, because it isn't notarized by Apple.
            Open System Settings → Privacy & Security, scroll down and click **Open Anyway**. You only do this once.

            Requires macOS 15 or later, on Apple silicon or Intel.
